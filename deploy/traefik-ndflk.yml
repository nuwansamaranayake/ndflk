# Traefik dynamic config (file provider). Copy to /etc/traefik/dynamic/ndflk.yml on srv1033016.
# Matches the host's Traefik v3 (root-traefik-1, host network, static config as CLI args in /root/docker-compose.yml):
# entrypoints "web" (:80) and "websecure" (:443), certificate resolver "mytlschallenge" (checked 2026-10-19).
http:
  routers:
    ndflk:
      rule: "Host(`ndflk.org`) || Host(`www.ndflk.org`)"
      entryPoints: ["websecure"]
      service: ndflk
      tls:
        certResolver: mytlschallenge
      middlewares: ["ndflk-www-redirect"]
    ndflk-http:
      rule: "Host(`ndflk.org`) || Host(`www.ndflk.org`)"
      entryPoints: ["web"]
      service: ndflk
      middlewares: ["ndflk-https-redirect"]
  middlewares:
    ndflk-https-redirect:
      redirectScheme:
        scheme: https
        permanent: true
    ndflk-www-redirect:
      redirectRegex:
        regex: "^https://www\\.ndflk\\.org/(.*)"
        replacement: "https://ndflk.org/${1}"
        permanent: true
  services:
    ndflk:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:3080"
